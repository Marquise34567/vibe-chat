<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4CFF"/>
      <stop offset="100%" stop-color="#3B2AD4"/>
    </linearGradient>
    <linearGradient id="ff-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE45E"/>
      <stop offset="100%" stop-color="#FFD60A"/>
    </linearGradient>
  </defs>
  <!-- Rounded squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#ff-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <!-- Bold F logo -->
  <text x="32" y="46" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="url(#ff-f)" text-anchor="middle">F</text>
</svg>
