name = "facefrenzy-match"
main = "worker/match-worker.ts"
compatibility_date = "2025-09-17"

[vars]
FRONTEND_URL = "https://www.facefrenzy.fun"
# Web Push pool pings — public key is safe to commit. Pair it with:
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUB   (e.g. mailto:you@domain)
# And set VITE_VAPID_PUBLIC_KEY to this same value in Vercel env.
VAPID_PUBLIC_KEY = "BJ9ff5lJHg6_qLtDDzyiM0X7ZysKLN5NUKWfh4X6Z8N5NGRXBrYWLiS5qg7G6oe7kr4j-t2Oy08zSdQOLNKwIis"
# Matchmaker runs as a single global DO (mm-global-0) — continental
# sharding was reverted because it fractured the worldwide queue.

# STRIPE_SECRET_KEY is set via: npx wrangler secret put STRIPE_SECRET_KEY
# ADMIN_KEY (optional) protects /api/analytics + /api/insights:
#   npx wrangler secret put ADMIN_KEY
# TURN for real-scale relay (~10-20% of calls can't do pure P2P):
#   provision Cloudflare Calls, then:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_API_TOKEN
# PostHog AI Observability requires these Worker bindings:
#   npx wrangler secret put VITE_PUBLIC_POSTHOG_KEY
#   npx wrangler secret put VITE_PUBLIC_POSTHOG_HOST
# If unset, the endpoints are open (fine for dev, restrict before launch).

# Workers AI — powers /api/insights (Llama summarizes matchmaking analytics)
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Matchmaker"]
